name: Validate development
on:
  pull_request:
  push:
    branches: [chore/security-and-approval-hardening]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:edge
      - run: npm run check:e2e
      - run: npm run build
      - run: npm test
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      # No deployment, publishing, credentials, or billing steps.
