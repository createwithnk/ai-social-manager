name: Velo static preview (GitHub Pages)

on:
  push:
    branches: [fix/beta-readiness-20261019]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velo-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static UI without backend credentials
        run: npm run build -- --base=/ai-social-manager/
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This workflow publishes only the explicitly named Velo preview branch.
    if: github.ref == 'refs/heads/fix/beta-readiness-20261019'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages for this repository
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
